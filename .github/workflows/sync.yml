name: Sync main to gh-pages

# GitHub Pages serves this repository from the gh-pages branch.
# main stays the single source of truth, so every change — including tabs
# published from the website — is mirrored here automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-gh-pages
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force-push main to gh-pages
        run: git push --force origin HEAD:gh-pages
